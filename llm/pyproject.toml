[project]
name = "spiderman-llm"
version = "0.1.0"
description = "From-scratch LLM implementation (modules, tokenizer, training scripts) migrated from cs336"
readme = "README.md"
authors = [
    { name = "Michael Vernau", email = "102547230+MichaelRuns@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "numpy>=2.5.3",
    "regex>=2026.9.10",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
